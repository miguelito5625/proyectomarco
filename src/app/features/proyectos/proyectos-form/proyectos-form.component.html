<h2 mat-dialog-title>{{ isEdit() ? 'Editar' : 'Nuevo' }} Proyecto</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="proyectoForm" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre del Proyecto</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. 1103 Lauren">
      @if (form.get('nombre')?.invalid) { <mat-error>Requerido</mat-error> }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dirección</mat-label>
      <textarea matInput formControlName="direccion" rows="2" placeholder="Ubicación completa (opcional)"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Estatus</mat-label>
      <mat-select formControlName="estatus">
        <mat-option value="activo">Activo</mat-option>
        <mat-option value="inactivo">Inactivo</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
  <button mat-flat-button color="primary" type="submit" form="proyectoForm" [disabled]="form.invalid || loading()">
    {{ isEdit() ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
