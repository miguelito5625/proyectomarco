<div class="page-container">
  <div class="page-header">
    <h2>Proyectos</h2>
    <button mat-flat-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Nuevo Proyecto
    </button>
  </div>

  <mat-card>
    
    <div class="table-controls">
      <mat-form-field appearance="outline" class="filter-input">
        <mat-label>Buscar...</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Escribe para buscar en la tabla...">
      </mat-form-field>
    </div>
    <mat-card-content class="table-container">
      @if (loading()) {
        <div class="loading-shade">
          Cargando datos...
        </div>
      }

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
        
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="direccion">
          <th mat-header-cell *matHeaderCellDef> Dirección </th>
          <td mat-cell *matCellDef="let element"> {{element.direccion || 'N/A'}} </td>
        </ng-container>

        <ng-container matColumnDef="estatus">
          <th mat-header-cell *matHeaderCellDef> Estatus </th>
          <td mat-cell *matCellDef="let element">
            <mat-chip [color]="element.estatus === 'activo' ? 'primary' : 'warn'">
              {{element.estatus | uppercase}}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="actions-col"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="actions-col">
            <button mat-icon-button color="primary" (click)="openForm(element)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteProyecto(element)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-cell" colspan="4">
            @if (!loading()) { No hay proyectos registrados. }
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
