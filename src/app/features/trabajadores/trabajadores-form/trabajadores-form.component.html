<h2 mat-dialog-title>{{ isEdit() ? 'Editar' : 'Nuevo' }} Trabajador</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="trabajadorForm" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="nombre" placeholder="Juan Pérez">
      @if (form.get('nombre')?.invalid) { <mat-error>Requerido</mat-error> }
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Pago Hora Regular</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="number" formControlName="pago_hora_regular">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Pago Hora Extra</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="number" formControlName="pago_hora_extra">
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Pago Sábado</mat-label>
        <span matTextPrefix>$&nbsp;</span>
        <input matInput type="number" formControlName="pago_sabado">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estatus</mat-label>
        <mat-select formControlName="estatus">
          <mat-option value="activo">Activo</mat-option>
          <mat-option value="inactivo">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading()">Cancelar</button>
  <button mat-flat-button color="primary" type="submit" form="trabajadorForm" [disabled]="form.invalid || loading()">
    {{ isEdit() ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
