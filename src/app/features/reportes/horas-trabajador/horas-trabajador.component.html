<div class="page-container">
  <div class="page-header">
    <h2>Reporte: Horas por Trabajador y Proyecto</h2>
  </div>

  <mat-card>
    
    <div class="table-controls">
      <mat-form-field appearance="outline" class="filter-input">
        <mat-label>Buscar...</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Escribe para buscar en la tabla...">
      </mat-form-field>
    </div>
    <mat-card-content class="table-container">
      @if (loading()) {
        <div class="loading-shade">Cargando datos...</div>
      }

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
        
        <ng-container matColumnDef="proyecto">
          <th mat-header-cell *matHeaderCellDef> Proyecto </th>
          <td mat-cell *matCellDef="let element"> {{element.proyecto_nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="trabajador">
          <th mat-header-cell *matHeaderCellDef> Trabajador </th>
          <td mat-cell *matCellDef="let element"> {{element.trabajador_nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="horas">
          <th mat-header-cell *matHeaderCellDef> Total Horas </th>
          <td mat-cell *matCellDef="let element"> 
            <strong>{{element.total_horas || 0}} hrs</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="grafica">
          <th mat-header-cell *matHeaderCellDef> Gráfica de Horas </th>
          <td mat-cell *matCellDef="let element" class="chart-cell">
            <div class="bar-container">
              <div class="bar" [style.width.%]="((element.total_horas || 0) / maxHoras()) * 100"></div>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-cell" colspan="4">
            @if (!loading()) { No hay datos en el reporte. }
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
