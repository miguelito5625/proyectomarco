<div class="layout-container">
  <mat-toolbar class="navbar">
    <button mat-icon-button (click)="sidenav.toggle()" aria-label="Alternar menú">
      <mat-icon>menu</mat-icon>
    </button>
    
    <div class="brand">
      <mat-icon>layers</mat-icon>
      <span class="hide-on-mobile">Proyecto Marco</span>
    </div>

    <span class="spacer"></span>
    
    <nav>
      <button mat-icon-button [matMenuTriggerFor]="themeMenu" aria-label="Cambiar tema">
        <mat-icon>palette</mat-icon>
      </button>
      <mat-menu #themeMenu="matMenu">
        <button mat-menu-item (click)="changeTheme('theme-azure-blue')">
          @if (themeService.currentTheme() === 'theme-azure-blue') { <mat-icon color="primary">check</mat-icon> }
          @else { <mat-icon></mat-icon> }
          <span>Azure & Blue</span>
        </button>
        <button mat-menu-item (click)="changeTheme('theme-rose-red')">
          @if (themeService.currentTheme() === 'theme-rose-red') { <mat-icon color="primary">check</mat-icon> }
          @else { <mat-icon></mat-icon> }
          <span>Rose & Red</span>
        </button>
        <button mat-menu-item (click)="changeTheme('theme-magenta-violet')">
          @if (themeService.currentTheme() === 'theme-magenta-violet') { <mat-icon color="primary">check</mat-icon> }
          @else { <mat-icon></mat-icon> }
          <span>Magenta & Violet</span>
        </button>
        <button mat-menu-item (click)="changeTheme('theme-cyan-orange')">
          @if (themeService.currentTheme() === 'theme-cyan-orange') { <mat-icon color="primary">check</mat-icon> }
          @else { <mat-icon></mat-icon> }
          <span>Cyan & Orange</span>
        </button>
      </mat-menu>

      <button mat-button [matMenuTriggerFor]="settingsMenu" aria-label="Opciones de usuario">
        <mat-icon>person</mat-icon>
        <span class="hide-on-mobile">{{ userName() }}</span>
      </button>
      <mat-menu #settingsMenu="matMenu">
        <button mat-menu-item (click)="openUserProfile()">
          <mat-icon>person</mat-icon>
          <span>Información de Usuario</span>
        </button>
        <button mat-menu-item (click)="openChangePassword()">
          <mat-icon>lock</mat-icon>
          <span>Cambiar Contraseña</span>
        </button>
      </mat-menu>

      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span class="hide-on-mobile">Cerrar Sesión</span>
      </button>
    </nav>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="over" class="sidenav">
      <mat-nav-list>
        <!-- A futuro se pueden agregar más enlaces aquí -->
        <a mat-list-item routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon matListItemIcon>home</mat-icon>
          <div matListItemTitle>Home</div>
        </a>
        <a mat-list-item routerLink="/trabajadores" routerLinkActive="active">
          <mat-icon matListItemIcon>people</mat-icon>
          <div matListItemTitle>Trabajadores</div>
        </a>
        <a mat-list-item routerLink="/proyectos" routerLinkActive="active">
          <mat-icon matListItemIcon>domain</mat-icon>
          <div matListItemTitle>Proyectos</div>
        </a>
        <a mat-list-item routerLink="/registros-tiempo" routerLinkActive="active">
          <mat-icon matListItemIcon>timer</mat-icon>
          <div matListItemTitle>Labor (Horas)</div>
        </a>
        <a mat-list-item routerLink="/registros-tiempov2" routerLinkActive="active">
          <mat-icon matListItemIcon>timer</mat-icon>
          <div matListItemTitle>Labor (Horas) V2</div>
        </a>
        <a mat-list-item routerLink="/nominas" routerLinkActive="active">
          <mat-icon matListItemIcon>payments</mat-icon>
          <div matListItemTitle>Nóminas</div>
        </a>
        <a mat-list-item routerLink="/gastos" routerLinkActive="active">
          <mat-icon matListItemIcon>receipt_long</mat-icon>
          <div matListItemTitle>Gastos Proyecto</div>
        </a>
        <a mat-list-item routerLink="/reporte-costo-labor" routerLinkActive="active">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <div matListItemTitle>Reporte Costos</div>
        </a>
        <a mat-list-item routerLink="/reporte-horas-trabajador" routerLinkActive="active">
          <mat-icon matListItemIcon>insights</mat-icon>
          <div matListItemTitle>Reporte Horas</div>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content-area">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
