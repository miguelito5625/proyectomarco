<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Proyectomarco</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.

      // If you're creating a Project Pages site, like https://user.github.io/repo-name,
      // then set pathSegmentsToKeep to 1 (enterprise sites may need a different value).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!--
      Note: this 404.html file must be at least 512 bytes for browsers to recognize it as a valid page.
      Padding comment:
      Proyectomarco SPA redirection handler for GitHub Pages.
      Ensures that deep links and page refreshes work properly without 404 errors.
    -->
  </body>
</html>
